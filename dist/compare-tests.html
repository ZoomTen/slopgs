<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slopgs vs reference -- tests</title>
<link rel="stylesheet" href="compare.css">
</head>
<body>
<h1>slopgs vs reference -- tests</h1>
<p>Compares each hand-built test MIDI (<code>tests/</code>) against its reference render, rendered live
in this page via <code>msgs.wasm</code> + <code>gm.dls</code>. Per-item table below is sourced from
<code>tests/README.adoc</code>.</p>
<details id="method">
<summary>how the comparison is made</summary>
<div id="notice"></div>
</details>
<div id="items"></div>
<script src="compare.js"></script>
<script>
(() => {
  // Sourced directly from tests/README.adoc's table.
  const TESTS = [
    { stem: "warm-echo", from: "flourish.mid", tests: "instrument release factor",
      regression: "instruments sounding too long", expect: "instruments releasing matches" },
    { stem: "wild-sweep", from: "Weekend by HueArme", tests: "pitch-bend range and interpolation",
      regression: "jumps too sudden, pitch bend range sounding too low", expect: "smooth curve between pitch bends" },
    { stem: "lazers", from: "GENERAL SERUM by Kot & Abstract 64", tests: "pitch-bend interpolation",
      regression: "immediate pitch movement, step-shaped", expect: "gradual pitch movement" },
    { stem: "radio", from: "GENERAL SERUM by Kot & Abstract 64", tests: "aliasing and pitch range",
      regression: "(spectrogram mismatch)", expect: "spectrogram matches, iunno what else to say." },
    { stem: "sine-gate", from: "Carve Your Own Path by Abstract 64 (Zumi's cover)", tests: "gating behavior",
      regression: "all the notes crashing into each other", expect: "notes reasonably separating from each other" },
    { stem: "sine2", from: "Carve Your Own Path by Abstract 64 (Zumi's cover)", tests: "gating behavior + expression + pitch bend",
      regression: "same as sine-gate", expect: "same as sine-gate" },
  ];
  const items = TESTS.map((t) => ({
    title: t.stem,
    midiUrl: `../tests/${t.stem}.mid`,
    flacUrl: `../tests/${t.stem}.flac`,
    extraRows: [
      ["derived from", t.from],
      ["tests what?", t.tests],
      ["regression example", t.regression],
      ["what to expect", t.expect],
    ],
  }));
  SlopgsCompare.renderPage({ items });
})();
</script>
</body>
</html>
